# Includes one of the default files in src/bootstrap/defaults
profile = "compiler"
change-id = 9999999

[llvm]
# Built from src/llvm-project so host headers and wasm libraries match.
download-ci-llvm = false
targets = "AArch64;WebAssembly;X86"
experimental-targets = ""

[rust]
codegen-backends = ["llvm"]
deny-warnings = false
llvm-tools = false
llvm-bitcode-linker = false
debug = false
debuginfo-level = 0
# Size-optimized release build for rustc.wasm (see debugger-sh/build.sh).
optimize = "z"
lto = "fat"
# Linked with its names so glassjar/sizes can attribute bytes; packaging strips them.
strip = false
codegen-units = 1
incremental = false
debug-assertions = false
debug-logging = false
frame-pointers = false
backtrace-on-ice = false
remap-debuginfo = true

[build]
ccache = true
docs = false
extended = false
tools = []
submodules = false
compiler-docs = false
host = ["wasm32-wasip1"]
target = ["wasm32-wasip1"]

[install]
prefix = "dist"
sysconfdir = "etc"

[target.'wasm32-wasip1']
wasi-root = "wasi-sdk/share/wasi-sysroot"
linker = "wasi-sdk/bin/clang"
codegen-backends = ["llvm"]

[target.'wasm32-wasip1-threads']
wasi-root = "wasi-sdk/share/wasi-sysroot"
linker = "wasi-sdk/bin/clang"
codegen-backends = ["cranelift"]
